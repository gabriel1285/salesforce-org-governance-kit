# Deploys what was merged, to the environment that branch owns.
#   develop   -> dev
#   release/* -> hml
#   hotfix/*  -> hml
#   main      -> prod (GitHub environment "prod" should require a reviewer)
#
# The delta starts at the tag deployed/<env> (the last successful deploy to that environment),
# so a failed deploy is picked up again by the next run instead of being skipped. The first
# run, with no tag yet, uses HEAD~1 (PRs are squash-merged, so that is the merged change).
name: Deploy

on:
  push:
    branches: [develop, 'release/**', 'hotfix/**', main]
    paths:
      - 'force-app-*/**'
      - 'sfdx-project.json'

permissions:
  contents: write   # to move the deployed/<env> checkpoint tag

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - id: map
        run: echo "env=$(bash scripts/ci/target-env.sh '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env }}
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for org credentials
        id: creds
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::notice::No SFDX_AUTH_URL for '${{ needs.target.outputs.env }}'. Skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Governance check
        if: steps.creds.outputs.skip != 'true'
        run: node scripts/governance-check.js

      - name: Install Salesforce CLI and sfdx-git-delta
        if: steps.creds.outputs.skip != 'true'
        run: bash scripts/ci/install-tools.sh

      - name: Authenticate
        if: steps.creds.outputs.skip != 'true'
        run: bash scripts/ci/auth.sh target

      - name: Build delta since the last deploy to this environment
        if: steps.creds.outputs.skip != 'true'
        run: |
          FROM="$(bash scripts/ci/checkpoint.sh get '${{ needs.target.outputs.env }}')"
          bash scripts/ci/build-delta.sh "$FROM" HEAD delta

      - name: Deploy
        if: steps.creds.outputs.skip != 'true'
        run: bash scripts/ci/deploy.sh deploy target delta

      - name: Move the checkpoint
        if: steps.creds.outputs.skip != 'true'
        run: bash scripts/ci/checkpoint.sh set '${{ needs.target.outputs.env }}'

      - name: Keep the deployed delta
        if: always() && steps.creds.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ needs.target.outputs.env }}-${{ github.sha }}
          path: delta/
          if-no-files-found: ignore
